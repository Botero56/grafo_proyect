[project]
name = "backend-rasperry"
version = "1.3.0"
description = "Backend de la Raspberry: impresión ESC/POS y actualizaciones desde GitLab"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-escpos[usb]",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
